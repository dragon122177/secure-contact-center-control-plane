apiVersion: v1
kind: ConfigMap
metadata:
  name: relayops-config
  namespace: relayops
data:
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: '8080'
  LOG_LEVEL: info
  CORS_ORIGIN: https://relayops.example.com
  JWT_EXPIRES_IN: 8h
  PROVIDER_SIGNATURE_TOLERANCE_SECONDS: '300'
  KAFKA_CLIENT_ID: relayops-control-plane
  KAFKA_TOPIC: relayops.domain-events
