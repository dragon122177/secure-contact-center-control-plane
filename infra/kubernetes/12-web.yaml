apiVersion: apps/v1
kind: Deployment
metadata:
  name: relayops-web
  namespace: relayops
  labels: &labels
    app.kubernetes.io/name: relayops-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: relayops
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: relayops-web
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: ghcr.io/dragon122177/relayops-web:latest
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ['ALL'] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: relayops-web
  namespace: relayops
  labels:
    app.kubernetes.io/name: relayops-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: relayops
spec:
  selector:
    app.kubernetes.io/name: relayops-web
  ports:
    - name: http
      port: 80
      targetPort: http
