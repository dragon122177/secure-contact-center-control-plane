apiVersion: apps/v1
kind: Deployment
metadata:
  name: relayops-api
  namespace: relayops
  labels: &labels
    app.kubernetes.io/name: relayops-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: relayops
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: relayops-api
  template:
    metadata:
      labels: *labels
    spec:
      serviceAccountName: relayops-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrations
          image: ghcr.io/dragon122177/relayops-api:latest
          command: ['node', 'apps/api/dist/commands/migrate.js']
          envFrom:
            - configMapRef: { name: relayops-config }
            - secretRef: { name: relayops-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ['ALL'] }
            readOnlyRootFilesystem: true
      containers:
        - name: api
          image: ghcr.io/dragon122177/relayops-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: { name: relayops-config }
            - secretRef: { name: relayops-secrets }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ['ALL'] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: relayops
  labels:
    app.kubernetes.io/name: relayops-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: relayops
spec:
  selector:
    app.kubernetes.io/name: relayops-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: relayops-api
  namespace: relayops
automountServiceAccountToken: false
