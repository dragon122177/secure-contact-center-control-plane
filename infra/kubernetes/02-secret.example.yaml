# Example only. In a real cluster, create this object with External Secrets,
# Sealed Secrets, or a cloud secret manager; never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: relayops-secrets
  namespace: relayops
type: Opaque
stringData:
  DATABASE_URL: postgres://replace-me
  REDIS_URL: rediss://replace-me
  KAFKA_BROKERS: kafka-1.example.internal:9093,kafka-2.example.internal:9093
  JWT_SECRET: replace-with-at-least-32-random-characters
  PROVIDER_WEBHOOK_SECRET: replace-with-a-provider-secret
