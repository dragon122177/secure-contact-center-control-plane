apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: relayops-api
  namespace: relayops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: relayops-api
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: relayops-api
  namespace: relayops
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: relayops-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: relayops-web
  namespace: relayops
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: relayops-web
