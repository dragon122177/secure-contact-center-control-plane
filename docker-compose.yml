name: relayops

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: relayops
      POSTGRES_USER: relayops
      POSTGRES_PASSWORD: relayops
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U relayops -d relayops']
      interval: 5s
      timeout: 3s
      retries: 15
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'allkeys-lru']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 15
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - '1'
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - '0'
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    healthcheck:
      test: ['CMD-SHELL', "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports:
      - '19092:19092'
      - '9644:9644'
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command:
      - /bin/sh
      - -c
      - node apps/api/dist/commands/migrate.js && node apps/api/dist/commands/seed.js
    environment: &api-environment
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      LOG_LEVEL: info
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://relayops:relayops@postgres:5432/relayops
      REDIS_URL: redis://redis:6379
      JWT_SECRET: compose-only-secret-replace-before-deployment
      JWT_EXPIRES_IN: 8h
      PROVIDER_WEBHOOK_SECRET: local-provider-webhook-secret
      PROVIDER_SIGNATURE_TOLERANCE_SECONDS: 300
      KAFKA_BROKERS: redpanda:9092
      KAFKA_CLIENT_ID: relayops-control-plane
      KAFKA_TOPIC: relayops.domain-events
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:8080/health/ready']
      interval: 10s
      timeout: 4s
      retries: 12
    ports:
      - '8080:8080'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'apps/api/dist/worker.js']
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api-proxy
        VITE_WS_URL: ''
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '3000:8080'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=7d']
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '9090:9090'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: relayops
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - '3001:3000'
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  redpanda-data:
  prometheus-data:
  grafana-data:
