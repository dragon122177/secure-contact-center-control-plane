name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: relayops_test
          POSTGRES_USER: relayops
          POSTGRES_PASSWORD: relayops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relayops -d relayops_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://relayops:relayops@localhost:5432/relayops_test
      TEST_DATABASE_URL: postgres://relayops:relayops@localhost:5432/relayops_test
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      PROVIDER_WEBHOOK_SECRET: ci-only-provider-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply migrations and synthetic seed
        run: npm run db:migrate && npm run db:seed
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test with coverage
        run: npm run test:coverage
      - name: Build production artifacts
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  container-builds:
    name: Container builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: relayops-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: relayops-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
